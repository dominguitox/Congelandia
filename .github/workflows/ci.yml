name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: congelandia_test
          MYSQL_USER: congelandia_test
          MYSQL_PASSWORD: testing_only
          MYSQL_ROOT_PASSWORD: testing_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'congelandia_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: congelandia_test
      DB_PASSWORD: testing_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, bcmath, gd
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Preparar Laravel
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force

      - name: Compilar frontend
        run: |
          npm ci
          npm run build

      - name: Comprobar empaquetado de producción
        run: node --test tools/deploy/build.test.mjs tools/deploy/pipeline.test.mjs

      - name: Comprobar calculo del cobro
        run: node --test tools/pos/cobro.test.mjs

      - name: Comprobar vistas y rutas
        run: |
          php artisan view:cache
          php artisan route:cache
          php artisan route:clear

      - name: Ejecutar pruebas
        run: php artisan test
